# Automatically performs jobs upon a commit push or pull-request

# This Action builds, tests, and lints the package. Then, it builds the
# documentation and deploys it on GitHub Pages.

# If the commit message matches a semantic version (e.g. "v0.1.2"), a GitHub
# release will be created by the `create_github_release` job.

name: continuous integration

# Allows this Action to be called by a push or pull request
on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:

  build_and_test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Makes every `uv` command use the matrix version. Otherwise, `uv run`
    # recreates the environment with the version in ".python-version".
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0

    # xgboost and lightgbm need OpenMP, which macOS does not include. The
    # README's study uses xgboost, so its example fails without it.
    - name: install OpenMP on macOS
      if: runner.os == 'macOS'
      run: brew install libomp

    - name: install dependencies
      run: uv sync

    - name: run pre-commit
      run: uv run pre-commit run -a --show-diff-on-failure

    - name: run tests
      run: uv run pytest tests

  lint_and_format:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: install dependencies
      run: uv sync

    - name: run ruff
      run: uv run ruff check --no-fix --output-format=github

    - name: run mypy
      run: uv run mypy

  document_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: install dependencies
      run: uv sync

    - name: build documentation with mkdocs
      run: uv run mkdocs build

    - name: deploy documentation to github pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: uv run mkdocs gh-deploy --force --clean --verbose

  # Only releases if a line of the commit message is a semantic version (e.g.
  # "v0.1.2"), so the version can be followed by other lines, such as a
  # "Co-Authored-By:" trailer. The release notes are the version's section of
  # CHANGELOG.md. Releases are only made from the `main` branch and after the
  # tests and linters pass.
  create_github_release:
    name: create github release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build_and_test, lint_and_format]
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: create github release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(git log -1 --format=%B | grep -m 1 -oxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | cut -c 2- || true)
        if [ -z "$version" ]; then
          echo "The commit message has no version line, so no release was made."
          exit 0
        fi
        if gh release view "v$version" > /dev/null 2>&1; then
          echo "::notice::Release v$version already exists."
          exit 0
        fi
        awk -v v="$version" '$1 == "##" && $2 == v {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "::error::Could not find an entry for $version in CHANGELOG.md"
          exit 1
        fi
        gh release create "v$version" --title "Release: $version" --notes-file notes.md --target "$GITHUB_SHA"
