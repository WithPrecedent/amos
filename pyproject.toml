# Project packaging rules and instructions

[project]
name = "amos"
description = "Automated Modeling for Open Scholarship"
authors = [{name = "Corey Rayburn Yung", email = "coreyrayburnyung@gmail.com"}]
license = {text = "Apache Software License 2.0"}
readme = "README.md"
requires-python = ">=3.11"
version = "0.2.6"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis"]
keywords = [
    "data science",
    "machine learning",
    "open science",
    "reproducibility",
    "research",
    "statistics",
    "workflow"]
dependencies = [
    "camina>=0.2.1",
    "chrisjen>=0.2.0",
    "nagata>=0.2.0",
    "numpy>=1.26",
    "pandas>=3.0",
    "scikit-learn>=1.5",
    "scipy>=1.10"]

[project.optional-dependencies]
# Each extra adds the packages that one group of techniques wraps. A technique
# imports its package only when it is used, so the extras can be installed in
# any combination.
boosting = ["catboost>=1.2", "lightgbm>=4.0", "xgboost>=2.0"]
# causalml has no wheels past Python 3.12, and on Python 3.11 and 3.12 the
# versions of DoWhy that work with pandas 3 need an older scipy than
# causalml does, so causalml is installed before Python 3.13 and DoWhy after.
# tigramite's models import networkx, which tigramite does not require.
causal = [
    "causalml>=0.17; python_version < '3.13'",
    "doubleml>=0.11",
    "dowhy>=0.14; python_version >= '3.13'",
    "networkx>=3.0",
    "rdrobust>=2.1",
    "tigramite>=5.2"]
encoders = ["category-encoders>=2.6", "skrub>=0.5"]
explain = ["eli5>=0.16", "interpret-core>=0.6", "shap>=0.45"]
fairness = ["fairlearn>=0.12"]
plots = ["matplotlib>=3.8", "scienceplots>=2.1", "seaborn>=0.13"]
polars = ["polars>=1.0", "pyarrow>=15"]
sampling = ["imbalanced-learn>=0.12"]
statistics = ["pyfixest>=0.30", "statsmodels>=0.14"]
survival = ["statsmodels>=0.14"]
tables = ["great-tables>=0.15"]
tuning = ["optuna>=4.0", "optuna-integration[sklearn]>=4.0"]
uncertainty = ["mapie>=1.0"]
word = ["python-docx>=1.1"]
# TabPFN needs PyTorch, which is large, so it is not part of "all".
tabpfn = ["tabpfn>=2.0"]
all = ["amos[boosting,causal,encoders,explain,fairness,plots,polars,sampling,statistics,survival,tables,tuning,uncertainty,word]"]

[project.urls]
Documentation = "https://WithPrecedent.github.io/amos"
Repository = "https://github.com/WithPrecedent/amos"
Homepage = "https://github.com/WithPrecedent/amos"
Issues = "https://github.com/WithPrecedent/amos/issues"
Changelog = "https://WithPrecedent.github.io/amos/changelog"

[dependency-groups]
dev = [
    "uv",
    "pandas-stubs",
    "markdown-callouts",
    "markdown-exec",
    "mkdocs",
    "mkdocs-coverage",
    "mkdocs-gen-files",
    "mkdocs-git-committers-plugin-2",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-minify-plugin",
    "mkdocstrings[python]",
    "toml",
    "mypy",
    "pre-commit",
    "ruff",
    {include-group = "tests"}]
tests = [
    "catboost>=1.2",
    "category-encoders>=2.6",
    "causalml>=0.17; python_version < '3.13'",
    "doubleml>=0.11",
    "dowhy>=0.14; python_version >= '3.13'",
    "eli5>=0.16",
    "fairlearn>=0.12",
    "great-tables>=0.15",
    "imbalanced-learn>=0.12",
    "interpret-core>=0.6",
    "lightgbm>=4.0",
    "mapie>=1.0",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "optuna>=4.0",
    "optuna-integration[sklearn]>=4.0",
    "polars>=1.0",
    "pyarrow>=15",
    "pyfixest>=0.30",
    "python-docx>=1.1",
    "rdrobust>=2.1",
    "scienceplots>=2.1",
    "seaborn>=0.13",
    "shap>=0.45",
    "skrub>=0.5",
    "statsmodels>=0.14",
    "tigramite>=5.2",
    "xgboost>=2.0",
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amos"]


[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
  "if TYPE_CHECKING:"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["amos", "tests"]



[tool.mypy]
files = ['src']
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# These packages are annotated but do not ship a py.typed marker.
module = [
    "bobbie.*",
    "camina.*",
    "chrisjen.*",
    "holden.*",
    "miller.*",
    "nagata.*",
    "wonka.*"]
follow_untyped_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--showlocals"
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["docs", "scripts", "site", "tests", ".*.*"]
fix = true
line-length = 80
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
lint.fixable = ["ALL"]
lint.ignore = [
    "A001",  # Variable is shadowing a Python builtin
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ARG003",  # Unused class method argument: `parameters`
    "ARG005",  # Unused lambda argument
    "COM812",  # Recommended disable by Ruff
    "C901",  # Too complex
    "D105",  # Missing docstring in magic method
    "D400",  # First line must end in a period
    "D401",  # First line of docstring should be in imperative mood
    "D406",  # Section name should end with a newline - bugged for 'Attributes:'
    "D407",  # Missing dashed underline after section ("Args")
    "D415",  # First line must end in a period, question mark, or exclamation point
    "E501",  # Line too long
    "E731",  # Do not assign a `lambda` expression, use a `def`
    "ERA001",  # Commented out code
    "EXE002",  # No shebang is present in an executable file
    "FBT001",  # Boolean positional arg in function definition
    "G004",  # Logging statement uses f-string
    "PTH123",  # `open()` should be replaced by `Path.open()`
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments to function call
    "PLR0915",  # Too many statements
    "PLR1711", # Useless 'return' at the end of function
    "Q000",  # Single quotes found but double quotes preferred
    "RET505",  # Unnecessary `else` after `return` statement
    # "S0001",  # Use of assert detected
    "SLF001", # Private member accessed
    "TID252",  # Relative imports are banned
    "TRY003",]  # Avoid specifying long messages outside the exception class
lint.select = [
    "A",  # flake8-buttons
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",  # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C",  #
    "C4",  # flake8-comprehensions
    "COM",  # flake8-commas
    "D",  # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",  # pydocstyle errors
    "ERA",  # eradicate
    "EXE",  # flake8-executable
    "F",  # Pyflakes
    "FBT",  # flake8-boolean-trap
    "G",  # flake8-logging-format
    "I",  # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "ISC",  # flake8-implicit-str-concat
    "N",  # pep8-naming
    "NPY",  # NumPy-specific rules
    "PD",  # pandas-vet
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",  # Pylint
    "PLC",  # Pylint
    "PLE",  # Pylint
    "PLR",  # Pylint
    "PLW",  # Pylint
    "PT",  # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",  # flake8-quotes
    "RUF",  # Ruff-specific rules
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "S",  # bandit
    "SIM",  # flake8-slots
    "SLF",  # flake8-self
    "T",  #
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",  # pyupgrade
    "W",  # pydocstyle warnings
    "YTT",]  # flake8-2020
lint.task-tags = ["To Do:"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
case-sensitive = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.uv]
package = true
